server {
    listen 80;
    server_name  _;

    client_max_body_size 50M;

    location /static/ {
        alias /app/static/;
    }

    # MCP server — only active when running with --profile mcp
    location /mcp {
        proxy_pass http://mcp_server:8002/mcp;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;

        include proxy_params;
    }

    # Django application
    location / {
        proxy_pass http://web:8000;
        proxy_read_timeout 300s;

        include proxy_params;
    }
}
