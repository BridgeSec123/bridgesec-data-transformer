
services:
  # web:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: bridgesec_django
  #   working_dir: /app/bridgesec_data_transformer
  #   env_file:
  #     - .env
  #   ports:
  #     - "8000:8000"
  #   volumes:
  #     - .:/app
  #     - ./output:/app/output
  #     - static_volume:/app/static
  #   command: >
  #      gunicorn bridgesec_data_transformer.wsgi:application --bind 0.0.0.0:8000 --workers 4 --access-logfile - --timeout 120
  #   restart: always

  rabbitmq:
    image: rabbitmq:3-management
    container_name: bridgesec_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: always

  celery_worker:
    build: .
    container_name: bridgesec_celery
    working_dir: /app/bridgesec_data_transformer
    env_file:
      - .env
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672/
    volumes:
     - .:/app
     - ./bridgesec_data_transformer/logs:/app/logs
     - ./bridgesec_data_transformer/output:/app/bridgesec_data_transformer/output
    command: celery -A bridgesec_data_transformer worker --loglevel=INFO
    restart: always

  celery_beat:
    build: .
    container_name: bridgesec_celery_beat
    working_dir: /app/bridgesec_data_transformer
    env_file:
      - .env
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672/
    volumes:
      - .:/app
      - ./bridgesec_data_transformer/logs:/app/logs
    command: celery -A bridgesec_data_transformer beat --loglevel=INFO
    depends_on:
      - rabbitmq
      - celery_worker
    restart: always

  consumer:
    build: .
    env_file:
      - .env
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672/
    container_name: bridgesec_consumer
    working_dir: /app/bridgesec_data_transformer
    command: python core/rabbitmq_consumer.py
    restart: always
    volumes:
      - .:/app

  mcp_server:
    build:
      context: ./mcp_server
      dockerfile: Dockerfile
    container_name: bridgesec_mcp
    env_file:
      - .env
    environment:
      - BRIDGESEC_API_URL=http://host.docker.internal:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8002:8002"
    restart: always

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    depends_on:
      - mcp_server
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/proxy_params:/etc/nginx/proxy_params
      - static_volume:/app/static

  # Logging Stack - Grafana + Loki + Promtail
  loki:
    image: grafana/loki:2.9.0
    container_name: bridgesec_loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
      - ./loki-config.yml:/etc/loki/local-config.yaml
    restart: unless-stopped

  promtail:
    image: grafana/promtail:2.9.0
    container_name: bridgesec_promtail
    volumes:
      - ./bridgesec_data_transformer/logs:/var/log/bridgesec
      - ./promtail-config.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.2.0
    container_name: bridgesec_grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ADMIN_USER=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana-dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
    depends_on:
      - loki
    restart: unless-stopped

  # ============================================================================
  # ELK Stack - Elasticsearch + Kibana + Filebeat
  # ============================================================================

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: bridgesec_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
      - "9300:9300"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: bridgesec_kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - SERVER_NAME=bridgesec-kibana
      - SERVER_HOST=0.0.0.0
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.11.0
    container_name: bridgesec_filebeat
    user: root
    command: filebeat -e -strict.perms=false
    volumes:
      - ./filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ./bridgesec_data_transformer/logs:/var/log/bridgesec:ro
      - filebeat_data:/usr/share/filebeat/data
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  # ============================================================================
  # Splunk Stack 
  # ============================================================================

  # Splunk Enterprise - Main Splunk Server with Web UI
  splunk-server:
    image: splunk/splunk:9.1
    container_name: bridgesec_splunk_server
    hostname: splunk-server
    environment:
      - SPLUNK_START_ARGS=--accept-license
      - SPLUNK_PASSWORD=${SPLUNK_PASSWORD:-changeme123}
      - SPLUNK_HEC_TOKEN=abcd1234-abcd-1234-abcd-1234abcd1234
    ports:
      - "8001:8000"      # Splunk Web UI (8001 to avoid conflict with Django on 8000)
      - "8088:8088"      # HEC (HTTP Event Collector)
      - "9997:9997"      # Splunk Forwarder Receiver
    volumes:
      - splunk_server_data:/opt/splunk/var
      - splunk_server_etc:/opt/splunk/etc
    restart: unless-stopped
    # profiles:
    #   - splunk
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Splunk Universal Forwarder - Ships logs to Splunk Server
  splunk-forwarder:
    image: splunk/universalforwarder:9.1
    container_name: bridgesec_splunk_forwarder
    hostname: bridgesec-splunk-forwarder
    environment:
      - SPLUNK_START_ARGS=--accept-license --answer-yes
      - SPLUNK_PASSWORD=${SPLUNK_PASSWORD:-changeme123}
      - SPLUNK_FORWARD_SERVER=splunk-server:9997
      - SPLUNK_ADD=monitor /logs
    volumes:
      - ./bridgesec_data_transformer/logs:/logs:ro
      - ./splunk-inputs.conf:/opt/splunkforwarder/etc/apps/search/local/inputs.conf
      - splunk_data:/opt/splunkforwarder/var
    depends_on:
      splunk-server:
        condition: service_healthy
    restart: unless-stopped

  # ============================================================================
  # OPA (Open Policy Agent) - Authorization Policy Engine
  # ============================================================================
  # Policies live in MongoDB and are pushed to OPA via /v1/policies HTTP API
  # on Django startup. NO volumes, NO --watch, NO bind-mounts.
  opa:
    image: openpolicyagent/opa:latest-rootless
    container_name: bridgesec_opa
    ports:
      - "8181:8181"
    command:
      - run
      - --server
      - --log-level=info
      - --addr=:8181
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8181/health"]
      interval: 10s
      timeout: 2s
      retries: 3
    restart: unless-stopped

volumes:
  static_volume:
  mongo_data:
  loki_data:
  grafana_data:
  elasticsearch_data:
  filebeat_data:
  splunk_data:
  splunk_server_data:
  splunk_server_etc:
