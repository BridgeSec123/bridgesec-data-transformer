
# =============================================================================
# BridgeSec Data Transformer — Docker Compose
#
# PROFILES (add --profile <name> to docker compose up):
#   (none)           → Core services only: web, celery, rabbitmq, redis, opa, nginx
#   --profile elk    → Elasticsearch + Kibana + Filebeat
#   --profile loki   → Grafana + Loki + Promtail
#   --profile splunk → Splunk Enterprise + Forwarder
#   --profile mcp    → MCP Server
#   --profile mongo  → Local MongoDB (skip if using MongoDB Atlas via MONGO_URI)
#
# QUICK START:
#   docker compose up -d                          # core only
#   docker compose --profile elk up -d            # core + ELK
#   docker compose --profile loki up -d           # core + Grafana/Loki
#   docker compose --profile elk --profile loki --profile mcp up -d  # everything
# =============================================================================

services:

  # ── Core: Django Application ────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bridgesec_django
    working_dir: /app/bridgesec_data_transformer
    entrypoint: /entrypoint.sh
    command: >
      gunicorn bridgesec_data_transformer.wsgi:application
      --bind 0.0.0.0:8000
      --workers 4
      --timeout 120
      --access-logfile -
      --error-logfile -
    env_file:
      - .env
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672/
      - REDIS_URL=redis://redis:6379/0
      - ELASTICSEARCH_URL=http://elasticsearch:9200
    ports:
      - "8007:8000"
    volumes:
      - .:/app
      - static_volume:/app/bridgesec_data_transformer/staticfiles
      - ./bridgesec_data_transformer/logs:/app/bridgesec_data_transformer/logs
      - ./bridgesec_data_transformer/output:/app/bridgesec_data_transformer/output
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      opa:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/swagger/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  # ── Core: Redis (Django Channels + optional caching) ────────────────────────
  redis:
    image: redis:7-alpine
    container_name: bridgesec_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Core: RabbitMQ (Celery broker + task notifications) ─────────────────────
  rabbitmq:
    image: rabbitmq:3-management
    container_name: bridgesec_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"   # Management UI → http://localhost:15672  (guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # ── Core: Celery Worker (parallel entity fetch) ─────────────────────────────
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bridgesec_celery
    working_dir: /app/bridgesec_data_transformer
    command: celery -A bridgesec_data_transformer worker --loglevel=INFO --concurrency=4
    env_file:
      - .env
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672/
    volumes:
      - .:/app
      - ./bridgesec_data_transformer/logs:/app/bridgesec_data_transformer/logs
      - ./bridgesec_data_transformer/output:/app/bridgesec_data_transformer/output
    depends_on:
      rabbitmq:
        condition: service_healthy
      web:
        condition: service_started
    restart: unless-stopped

  # ── Core: Celery Beat (scheduled midnight sync) ──────────────────────────────
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bridgesec_celery_beat
    working_dir: /app/bridgesec_data_transformer
    command: celery -A bridgesec_data_transformer beat --loglevel=INFO
    env_file:
      - .env
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672/
    volumes:
      - .:/app
      - ./bridgesec_data_transformer/logs:/app/bridgesec_data_transformer/logs
    depends_on:
      rabbitmq:
        condition: service_healthy
      celery_worker:
        condition: service_started
    restart: unless-stopped

  # ── Core: RabbitMQ Consumer (task completion notifications) ─────────────────
  consumer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bridgesec_consumer
    working_dir: /app/bridgesec_data_transformer
    command: python core/rabbitmq_consumer.py
    env_file:
      - .env
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672/
    volumes:
      - .:/app
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # ── Core: OPA (Open Policy Agent — authorization) ───────────────────────────
  opa:
    image: openpolicyagent/opa:latest
    container_name: bridgesec_opa
    ports:
      - "8181:8181"
    command:
      - run
      - --server
      - --log-level=info
      - --addr=:8181
    restart: unless-stopped

  # ── Core: Nginx (reverse proxy) ─────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: bridgesec_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/proxy_params:/etc/nginx/proxy_params:ro
      - static_volume:/app/static:ro
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

  # ── Optional: Local MongoDB (skip if using MongoDB Atlas via MONGO_URI) ──────
  mongodb:
    image: mongo:7
    container_name: bridgesec_mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=bridgesec_master
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # ── Optional: MCP Server ─────────────────────────────────────────────────────
  mcp_server:
    build:
      context: ./mcp_server
      dockerfile: Dockerfile
    container_name: bridgesec_mcp
    env_file:
      - .env
    environment:
      - BRIDGESEC_API_URL=http://web:8000
    ports:
      - "8002:8002"
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

  # ── Optional: Grafana + Loki + Promtail ──────────────────────────────────────
  loki:
    image: grafana/loki:2.9.0
    container_name: bridgesec_loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
      - ./loki-config.yml:/etc/loki/local-config.yaml:ro
    restart: unless-stopped

  promtail:
    image: grafana/promtail:2.9.0
    container_name: bridgesec_promtail
    volumes:
      - ./bridgesec_data_transformer/logs:/var/log/bridgesec:ro
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.2.0
    container_name: bridgesec_grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ADMIN_USER=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana-dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
    depends_on:
      - loki
    restart: unless-stopped

  # ── Optional: ELK Stack ───────────────────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: bridgesec_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: bridgesec_kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - SERVER_NAME=bridgesec-kibana
      - SERVER_HOST=0.0.0.0
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.11.0
    container_name: bridgesec_filebeat
    user: root
    command: filebeat -e -strict.perms=false
    volumes:
      - ./filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ./bridgesec_data_transformer/logs:/var/log/bridgesec:ro
      - filebeat_data:/usr/share/filebeat/data
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  # ── Optional: Splunk Stack ────────────────────────────────────────────────────
  splunk-server:
    image: splunk/splunk:9.1
    container_name: bridgesec_splunk_server
    hostname: splunk-server
    environment:
      - SPLUNK_START_ARGS=--accept-license
      - SPLUNK_PASSWORD=${SPLUNK_PASSWORD:-changeme123}
      - SPLUNK_HEC_TOKEN=abcd1234-abcd-1234-abcd-1234abcd1234
    ports:
      - "8001:8000"
      - "8088:8088"
      - "9997:9997"
    volumes:
      - splunk_server_data:/opt/splunk/var
      - splunk_server_etc:/opt/splunk/etc
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  splunk-forwarder:
    image: splunk/universalforwarder:9.1
    container_name: bridgesec_splunk_forwarder
    hostname: bridgesec-splunk-forwarder
    environment:
      - SPLUNK_START_ARGS=--accept-license --answer-yes
      - SPLUNK_PASSWORD=${SPLUNK_PASSWORD:-changeme123}
      - SPLUNK_FORWARD_SERVER=splunk-server:9997
      - SPLUNK_ADD=monitor /logs
    volumes:
      - ./bridgesec_data_transformer/logs:/logs:ro
      - ./splunk-inputs.conf:/opt/splunkforwarder/etc/apps/search/local/inputs.conf
      - splunk_data:/opt/splunkforwarder/var
    depends_on:
      splunk-server:
        condition: service_healthy
    restart: unless-stopped

# =============================================================================
volumes:
  static_volume:
  mongo_data:
  loki_data:
  grafana_data:
  elasticsearch_data:
  filebeat_data:
  splunk_data:
  splunk_server_data:
  splunk_server_etc:
