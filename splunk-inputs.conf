# Splunk Universal Forwarder Configuration
# monitors JSON log files and forwards to Splunk

[monitor:///logs/app.log]
disabled = false
sourcetype = _json
index = bridgesec
source = bridgesec_app
ignoreOlderThan = 7d

[monitor:///logs/bridgesec.log]
disabled = false
sourcetype = _json
index = bridgesec
source = bridgesec_api
ignoreOlderThan = 7d

[monitor:///logs/bridgesec_celery.log]
disabled = false
sourcetype = _json
index = bridgesec
source = bridgesec_celery
ignoreOlderThan = 7d
